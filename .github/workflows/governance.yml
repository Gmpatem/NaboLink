name: Governance Checks
on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
      - 'fix/**'
      - 'experiment/**'
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical project context
        run: python3 scripts/verify_project.py
      - name: Test governance context parsing
        run: python3 -m unittest discover -s tests -p 'test_governance_*.py'
